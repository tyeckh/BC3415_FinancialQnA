<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align the container to the top of the page */
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 800px; /* Increased width to allow more content */
            width: 90%;
            text-align: left; /* Left-align the text for readability */
            overflow-y: auto; /* Allow scrolling if content overflows */
            max-height: 90vh; /* Ensure the container fits within the viewport */
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        h4 {
            color: #555;
            margin-bottom: 20px;
            white-space: pre-wrap; /* Preserve line breaks and spacing */
            font-size: 18px;
            line-height: 1.6;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 20px; /* Add spacing above the button */
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 600px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 800px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reply</h2>
        <h4>{{r}}</h4>
        <form action="/" method="post">
            <input type="submit" value="Main">
        </form>
    </div>
</body>
</html>
